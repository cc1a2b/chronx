name: release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "pyproject.toml"
      - "src/**"
      - ".github/workflows/workflow.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  DIST_ARTIFACT: chronx-dist

jobs:
  build:
    name: Build and verify distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install build tooling
        run: python -m pip install --disable-pip-version-check "build==1.6.1" "twine==7.0.0"

      - name: Build sdist and wheel
        run: python -m build --sdist --wheel --outdir dist

      # hatchling reads the version from src/chronx/__init__.py, so a tag that
      # disagrees with it would silently publish the wrong version.
      - name: Assert the built version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="${GITHUB_REF_NAME#v}"
          missing=0
          for artifact in "dist/chronx-${version}.tar.gz" "dist/chronx-${version}-py3-none-any.whl"; do
            if [ ! -f "${artifact}" ]; then
              echo "::error::tag ${GITHUB_REF_NAME} expects ${artifact}, which was not built"
              missing=1
            fi
          done
          if [ "${missing}" -ne 0 ]; then
            printf 'dist/ contains:\n'
            ls -1 dist
            echo "::error::set __version__ in src/chronx/__init__.py to ${version}, or move the tag"
            exit 1
          fi

      - name: Validate package metadata
        run: python -m twine check --strict dist/*

      - name: Confirm the sdist rebuilds
        run: |
          python -m pip install --disable-pip-version-check --quiet "dist/chronx-"*.tar.gz --no-deps --target /tmp/sdist-check
          test -f /tmp/sdist-check/chronx/cli.py

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.DIST_ARTIFACT }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  smoke-test:
    name: Install on Python ${{ matrix.python-version }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.DIST_ARTIFACT }}
          path: dist

      - name: Install the wheel with its dependencies
        run: python -m pip install --disable-pip-version-check "dist/chronx-"*.whl

      - name: Exercise the console script
        run: |
          chronx --version
          chronx --help
          python -c "import chronx; print(chronx.__version__)"

  publish:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, smoke-test]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/chronx
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.DIST_ARTIFACT }}
          path: dist

      - name: Publish to PyPI via trusted publishing
        uses: pypa/gh-action-pypi-publish@a892a5a61159132606e93a2fa6f4358831b04d26 # v1.14.2
        with:
          packages-dir: dist
          print-hash: true
